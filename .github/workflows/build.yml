name: Build

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uhdmovies-builds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        path: src
        fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build extension
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson
          test -f build/plugins.json
          find . -path '*/build/*.cs3' -type f -print -quit | grep -q .

      # Check this branch out only after compiling. It prevents a stale checkout when
      # builds/ is updated while the Gradle job is running.
      - name: Check out published builds
        uses: actions/checkout@v7
        with:
          ref: builds
          path: builds
          fetch-depth: 1

      - name: Stage extension files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find "$GITHUB_WORKSPACE/src" -path '*/build/*.cs3' -type f -print)
          if (( ${#artifacts[@]} == 0 )); then
            echo 'No .cs3 file was produced.' >&2
            exit 1
          fi

          rm -f "$GITHUB_WORKSPACE/builds/UHDMovies.cs3"
          cp "${artifacts[@]}" "$GITHUB_WORKSPACE/builds/"
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Publish builds branch
        shell: bash
        working-directory: builds
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No build changes to publish.'
            exit 0
          fi
          git commit -m "Build ${GITHUB_SHA}"
          git push origin HEAD:builds
